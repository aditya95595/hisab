<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How do you calculate a discount?","acceptedAnswer":{"@type":"Answer","text":"Price × discount ÷ 100, then subtract. 20% off ₹1,000 = ₹1,000 − ₹200 = ₹800. One line of maths the sale banners hope you skip."}},{"@type":"Question","name":"How do stacked discounts work, like 20% + 10%?","acceptedAnswer":{"@type":"Answer","text":"One after another, not added. 20% off ₹1,000 is ₹800; 10% off ₹800 is ₹720. That's 28% off total, not 30%. Retailers know this. Now you do too."}},{"@type":"Question","name":"Does the discount apply before or after tax?","acceptedAnswer":{"@type":"Answer","text":"Usually the discount applies to the pre-tax price in India, with GST on the discounted amount — but the bill is the final word. Check it."}}]}</script>
