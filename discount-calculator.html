<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How do you calculate a discount?","acceptedAnswer":{"@type":"Answer","text":"Multiply the price by the discount percent, divide by 100, and subtract from the price. A 20% discount on ₹1,000 is ₹1,000 − ₹200 = ₹800."}},{"@type":"Question","name":"How do stacked discounts work, like 20% + 10%?","acceptedAnswer":{"@type":"Answer","text":"They apply one after another, not added together. 20% off ₹1,000 is ₹800; then 10% off ₹800 is ₹720 — a total of 28% off, not 30%."}},{"@type":"Question","name":"Does the discount apply before or after tax?","acceptedAnswer":{"@type":"Answer","text":"It depends on the seller and the tax rules. Most Indian retail discounts apply to the pre-tax price, with GST calculated on the discounted amount — check the bill to be sure."}}]}</script>
