<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is EMI?","acceptedAnswer":{"@type":"Answer","text":"EMI (Equated Monthly Instalment) is the fixed amount you pay your lender every month until the loan is fully repaid. It has two parts: interest on the outstanding balance and repayment of the principal."}},{"@type":"Question","name":"Does a longer tenure always mean a lower EMI?","acceptedAnswer":{"@type":"Answer","text":"Yes, stretching the tenure lowers the monthly EMI — but you pay interest for more months, so the total interest paid goes up. Shorter tenures cost more per month but less overall."}},{"@type":"Question","name":"Is the EMI the same every month?","acceptedAnswer":{"@type":"Answer","text":"With a fixed interest rate, yes. Early EMIs are mostly interest; later EMIs are mostly principal. If your loan has a floating rate, the EMI or tenure changes when the rate changes."}}]}</script>
