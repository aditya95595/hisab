<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is EMI?","acceptedAnswer":{"@type":"Answer","text":"The fixed amount you pay your lender every month until the loan is cleared. Every EMI is two things glued together: interest on what you still owe, plus a bite of the principal."}},{"@type":"Question","name":"Does a longer tenure always mean a lower EMI?","acceptedAnswer":{"@type":"Answer","text":"Yes — but it's a trade, not a free lunch. Longer tenure means a smaller EMI and a much bigger total interest bill. On a 20-year home loan, the interest can nearly equal the principal. Shorter tenure hurts every month but wins overall."}},{"@type":"Question","name":"Is the EMI the same every month?","acceptedAnswer":{"@type":"Answer","text":"With a fixed rate, yes. With a floating rate, the bank either bumps your EMI or quietly stretches your tenure when rates move — ask which one they do before you sign."}}]}</script>
