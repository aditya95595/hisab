<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is compounding frequency in FD?","acceptedAnswer":{"@type":"Answer","text":"How often the bank adds interest to your balance — monthly, quarterly, half-yearly or yearly. More frequent compounding earns a little more at the same rate. Most Indian FDs compound quarterly."}},{"@type":"Question","name":"Is FD interest taxable?","acceptedAnswer":{"@type":"Answer","text":"Yes — it joins your income and gets taxed at your slab. Banks also cut TDS if your interest crosses the threshold in a financial year. The 'maturity value' here is before all that."}},{"@type":"Question","name":"Can I break an FD before maturity?","acceptedAnswer":{"@type":"Answer","text":"Usually yes, but there's a penalty (often around 1%) and you earn interest at a lower rate for the time completed. Breaking an FD should hurt a little — that's the design."}}]}</script>
