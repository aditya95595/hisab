<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is compounding frequency in FD?","acceptedAnswer":{"@type":"Answer","text":"It is how often the bank adds interest to your deposit — yearly, half-yearly, quarterly or monthly. More frequent compounding gives a slightly higher maturity value at the same rate."}},{"@type":"Question","name":"Is FD interest taxable?","acceptedAnswer":{"@type":"Answer","text":"Yes, FD interest is taxable as per your income slab in India. Banks also deduct TDS if your interest crosses the threshold in a financial year."}},{"@type":"Question","name":"Can I break an FD before maturity?","acceptedAnswer":{"@type":"Answer","text":"Usually yes, but most banks charge a premature-withdrawal penalty (often around 1%) and pay interest at a lower rate for the period completed."}}]}</script>
